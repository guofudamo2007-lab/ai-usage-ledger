[package]
name = "kedu-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
csv = "1"
fancy-regex = "0.16"
form_urlencoded = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
walkdir = "2"
zstd = "0.13"

[profile.release]
strip = true
